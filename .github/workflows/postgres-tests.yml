name: PostgreSQL tests

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Keep this focused diagnostic bounded.
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_test -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://inventory_test:inventory_test@localhost:5432/inventory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Run the complete tenant user administration module to catch order/teardown interactions.
      - run: >-
          pytest -vv --tb=short -o faulthandler_timeout=60
          regression_tests/test_tenant_user_administration.py
