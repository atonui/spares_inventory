name: PostgreSQL tests

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_test -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Bound database waits in every test connection, including route connections.
      PGOPTIONS: "-c lock_timeout=5s -c statement_timeout=60s"
      TEST_DATABASE_URL: postgresql://inventory_test:inventory_test@localhost:5432/inventory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest regression_tests -vv --tb=short -o faulthandler_timeout=90 --junitxml=postgres-test-results.xml
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results
          path: postgres-test-results.xml
          if-no-files-found: warn
