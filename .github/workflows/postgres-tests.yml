name: PostgreSQL tests

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Bound the diagnostic run so a stalled test cannot occupy a runner for hours.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_test -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://inventory_test:inventory_test@localhost:5432/inventory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Verbose output identifies the test that is active if the suite stalls.
      - run: pytest regression_tests -vv --tb=no
